version: '3.8'

services:
  # --- Database Service (PostgreSQL 16) ---
  postgres:
    image: postgres:16-alpine
    container_name: resumelens-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumelens}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d resumelens" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumelens-net

  # --- Backend Service (Spring Boot 3 / Java 17) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumelens-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-resumelens}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
      JWT_SECRET: ${JWT_SECRET:-your_production_secret_key_at_least_32_characters_long!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - resumelens-net

  # --- Frontend Service (React / Vite + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumelens-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - resumelens-net

volumes:
  postgres_data:

networks:
  resumelens-net:
    driver: bridge
