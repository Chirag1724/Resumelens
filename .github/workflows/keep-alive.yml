name: Keep-Alive Heartbeat (Render & Supabase)

# This workflow prevents:
# 1. Supabase Free Tier Auto-Pause: Runs every 3 days to execute 'SELECT 1'.
# 2. Render Free Tier Cold Starts: Pings every 14 mins during business hours (9:30 AM - 9:30 PM IST, Mon-Fri).
#    Using business hours prevents burning through Render's 750 free hours/month limit!

on:
  schedule:
    # 1. Supabase Keep-Alive: Every 3 days at midnight UTC (00:00)
    - cron: '0 0 */3 * *'
    # 2. Render Business Hours Keep-Alive: Every 14 mins from 04:00 to 16:00 UTC (Mon-Fri)
    - cron: '*/14 4-16 * * 1-5'

  # Allows manual 1-click trigger from GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to ResumeLens Backend
        env:
          TARGET_URL: ${{ secrets.BACKEND_URL || 'https://resumelens-backend.onrender.com' }}
        run: |
          echo "Sending heartbeat to $TARGET_URL/api/v1/health ..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$TARGET_URL/api/v1/health" || true)
          echo "Response: $RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" = "200" ]; then
            echo "Heartbeat successful. Database connection verified & activity timestamp refreshed."
          else
            echo "Warning: Heartbeat returned HTTP status $STATUS. Server may be waking up."
          fi
